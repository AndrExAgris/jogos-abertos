server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Service worker e páginas: sempre conferir se há versão nova.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome não mudam: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(woff2|png|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Fallback de SPA (as rotas do app usam #, mas fica por segurança).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
